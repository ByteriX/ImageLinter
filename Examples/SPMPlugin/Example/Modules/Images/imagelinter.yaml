
isEnabled: true
relativeImagesPath: /Sources/Images/Resources/Error
relativeSourcePath: /
relativeSourcePaths:
  - /Sources1
  - /Sources2
usingTypes:
  - case: uiKit
  - case: uiKitLiteral
  - case: swiftUI
  - case: swiftGen
    enumName: Asset
  - case: custom
    pattern: "(.*)".image
    isSwiftGen: false
  - case: custom
    pattern: "(.*)".image
    isSwiftGen: true
    - case: custom
    pattern: "(.*)".name
checkingNameTypes:
  - case: camelCase
    filter: vector, >1kb
  - case: firstUpperCase
    message: First case should be uppered for vector images with 50px and more
    filter: vector, > 0.05Kpx
ignoredUnusedImages:
  - temp
ignoredUndefinedImages:
  - temp
rastorExtensions:
  - png
  - jpg
  - jpeg
vectorExtensions:
  - pdf
  - svg
sourcesExtensions:
  - swift
  - mm
resourcesExtensions:
  - storyboard
  - xib
isAllFilesErrorShowing: false
maxVectorFileSize: 30000
maxVectorImageSize:
  width: 100
  height: 100
maxRastorFileSize: 300000
maxRastorImageSize:
  width: 300
  height: 300
isCheckingFileSize: true
isCheckingImageSize: true
isCheckingPdfVector: true
isCheckingSvgVector: true
isCheckingScaleSize: true
isCheckingDuplicatedByName: true
isCheckingDuplicatedByContent: true
targetPlatforms:
  - iOS
  - iPadOS
  - macOS
  - tvOS
  - visionOS
  - watchOS
